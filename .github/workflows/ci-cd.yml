# Vapp API — Phase 1 (CI) + Phase 2 (CD via self-hosted runner on VPS)
# CI/package on GitHub hosted; deploy locally on VPS (no inbound SSH from abroad).
# Never docker pull GHCR on production server (Iran VPS — unreliable/blocked).
name: API CI/CD

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:
    inputs:
      deploy:
        description: "Force production deploy after CI (main/master only)"
        type: boolean
        default: false

concurrency:
  group: vapp-api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "8.0.x"
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  API_IMAGE: vapp-api
  DOCKERFILE: docker/Dockerfile
  COMPOSE_FILE: docker/docker-compose.production.yml
  ENV_FILE: docker/.env
  REMOTE_API_DIR: /root/Api_Vapp_Manually

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          cache: true
          cache-dependency-path: |
            **/*.csproj

      - name: Restore
        run: |
          dotnet restore Api_Vapp.sln
          dotnet restore Tests/Api_Vapp.Tests.csproj

      - name: Build Release
        run: |
          dotnet build Api_Vapp.sln -c Release --no-restore
          dotnet build Tests/Api_Vapp.Tests.csproj -c Release --no-restore

      # Full suite includes integration tests — gate on stable unit subset only.
      - name: Run CI smoke tests
        run: |
          set -euo pipefail
          mkdir -p TestResults
          dotnet test Tests/Api_Vapp.Tests.csproj \
            -c Release --no-build --no-restore \
            --filter "FullyQualifiedName~SmsProviderErrorMapperTests|FullyQualifiedName~EducationalVideoPlaybackHelperTests|FullyQualifiedName~SmsDeliveryRefundCopyAndFinanceTests" \
            --logger "trx;LogFileName=ci-smoke.trx" \
            --results-directory TestResults

      - name: Upload TRX
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

      - name: Quality gate summary
        if: always()
        run: |
          python3 - <<'PY'
          import glob, os, sys, xml.etree.ElementTree as ET

          files = sorted(glob.glob("TestResults/*.trx"))
          expected = {"ci-smoke.trx"}
          found = {os.path.basename(f) for f in files}
          total = passed = failed = skipped = 0
          lines = ["## Vapp API CI Quality Gate", ""]
          for f in files:
              root = ET.parse(f).getroot()
              c = root.find(".//{*}Counters")
              if c is None:
                  continue
              t = int(c.attrib.get("total", "0"))
              p = int(c.attrib.get("passed", "0"))
              ff = int(c.attrib.get("failed", "0"))
              s = int(c.attrib.get("notExecuted", "0"))
              total += t; passed += p; failed += ff; skipped += s
              lines.append(f"- `{os.path.basename(f)}` → total={t}, passed={p}, failed={ff}, skipped={s}")
          lines[1:1] = [f"- Total: **{total}** · Passed: **{passed}** · Failed: **{failed}** · Skipped: **{skipped}**", ""]
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              with open(summary, "a", encoding="utf-8") as fp:
                  fp.write("\n".join(lines) + "\n")
          missing = expected - found
          if missing:
              print(f"ERROR: missing TRX: {sorted(missing)}", file=sys.stderr)
              sys.exit(1)
          if total <= 0:
              print("ERROR: no tests executed", file=sys.stderr)
              sys.exit(1)
          if failed > 0:
              print(f"ERROR: {failed} failed", file=sys.stderr)
              sys.exit(1)
          print("Quality gate OK")
          PY

  package:
    name: Package API image
    runs-on: ubuntu-latest
    needs: ci
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image (GHA layer cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          push: false
          load: true
          tags: ${{ env.API_IMAGE }}
          cache-from: type=gha,scope=vapp-api
          cache-to: type=gha,mode=max,scope=vapp-api

      - name: Export compressed image artifact
        run: |
          set -euo pipefail
          docker save "${{ env.API_IMAGE }}" | gzip -1 > api-image.tar.gz
          ls -lh api-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-docker-image
          path: api-image.tar.gz
          retention-days: 1

  deploy:
    name: Deploy API → Production
    runs-on: [self-hosted, vapp-prod]
    needs: package
    if: >
      (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
      || (github.event_name == 'workflow_dispatch' && github.event.inputs.deploy == 'true'
          && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'))
    environment: production
    timeout-minutes: 30
    steps:
      - name: Download API image artifact
        uses: actions/download-artifact@v4
        with:
          name: api-docker-image

      - uses: actions/checkout@v4

      - name: Sync devops scripts on server
        run: |
          set -euo pipefail
          rsync -a devops/ "${{ env.REMOTE_API_DIR }}/devops/"

      - name: Load image + restart API (local)
        run: |
          set -euo pipefail
          echo "Loading API image on VPS..."
          gunzip -c api-image.tar.gz | docker load
          cd "${{ env.REMOTE_API_DIR }}"
          export COMPOSE_HTTP_TIMEOUT=300 DOCKER_CLIENT_TIMEOUT=300
          docker compose -f "${{ env.COMPOSE_FILE }}" stop api 2>/dev/null || true
          docker compose -f "${{ env.COMPOSE_FILE }}" rm -sf api 2>/dev/null || true
          docker rm -f vapp_api_prod 2>/dev/null || true
          docker compose -f "${{ env.COMPOSE_FILE }}" --env-file "${{ env.ENV_FILE }}" \
            up -d --no-build --no-deps --force-recreate api

      - name: Wait DB + AppVersion ready
        run: bash "${{ env.REMOTE_API_DIR }}/devops/scripts/wait-db-ready.sh"

      - name: Post-deploy verify
        run: bash "${{ env.REMOTE_API_DIR }}/devops/scripts/post-deploy-verify.sh" --api-only
